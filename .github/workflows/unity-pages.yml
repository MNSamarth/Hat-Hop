name: Build Unity and deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.UNITY_CI_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI configuration and generated scenes
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE" || { echo 'Set UNITY_LICENSE in repository Actions secrets.'; exit 1; }
          test -n "$UNITY_EMAIL" || { echo 'Set UNITY_EMAIL in repository Actions secrets.'; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo 'Set UNITY_PASSWORD in repository Actions secrets.'; exit 1; }
          test -f Assets/HatHop/Scenes/Prologue.unity || { echo 'Generate, test and commit the Leap of Faith release scenes first.'; exit 1; }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Unity-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-${{ github.sha }}
          restore-keys: Unity-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: HatHop.Editor.WebReleaseBuilder.Build
          versioning: None
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
